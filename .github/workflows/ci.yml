name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets
      - run: cargo doc --no-deps

  test:
    name: Test (${{ matrix.os }}, Rust ${{ matrix.rust }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-latest]
        rust: [stable, "1.85"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo test

  mmvdump:
    name: Check output with PCP's mmvdump
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install PCP
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pcp
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run monte_pi and dump its MMV file
        run: |
          mmvdump=$(command -v mmvdump ||
              find /usr/lib /usr/libexec /var/lib/pcp -name mmvdump -type f 2>/dev/null | head -n1)
          file="$RUNNER_TEMP/monte_pi"
          cargo run --example monte_pi -- "$file" 20
          # mmvdump exits non-zero if it finds a problem with the file.
          "$mmvdump" "$file" | tee "$RUNNER_TEMP/mmvdump.txt"
          for expected in 'Version    = 1' 'trials = 20' 'units=count' 'pi = ' \
              'shorttext=Estimated Pi'; do
              grep -qF -- "$expected" "$RUNNER_TEMP/mmvdump.txt" ||
                  { echo "missing '$expected' in mmvdump output" >&2; exit 1; }
          done
