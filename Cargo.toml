[package]
name = "mmv"
version = "0.2.0"
authors = ["Saurav Sachidanand <sauravsachidanand@gmail.com>"]
edition = "2024"
rust-version = "1.85"
description = "Proof-of-concept pure Rust writer for PCP MMV v1 files"
repository = "https://github.com/saurvs/mmv-rs"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["pcp", "mmv", "performance", "metrics", "instrumentation"]
categories = ["development-tools::profiling"]
# Proof of concept: use https://crates.io/crates/hornet instead. The `mmv`
# name on crates.io also belongs to an unrelated crate.
publish = false

[dependencies]
bitflags = "2"
memmap2 = "0.9"

[dev-dependencies]
rand = "0.10"
